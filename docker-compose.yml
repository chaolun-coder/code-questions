# 一条命令启动整套环境：
#   docker compose up -d --build
# 访问 http://localhost:3000 （后端单端口托管前端产物）
# 默认账号/密码：postgres / postgres，无需额外配置环境变量。
services:
  db:
    image: postgres:16-alpine
    container_name: code-questions-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code_questions
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_questions"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: code-questions-server
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/code_questions
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
